name: Fetch IPO Status

on:
  workflow_dispatch:
    inputs:
      ipo_prefix:
        description: 'IPO name prefix (optional)'
        required: false
      pan_list:
        description: 'Comma-separated PANs (optional)'
        required: false

jobs:
  run-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run fetch_ipo_status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HTML_URL: ${{ secrets.IPO_STATUS_HTML_URL }}
          API_URL: ${{ secrets.IPO_STATUS_API_URL }}
          PAN_COMMA: ${{ secrets.PAN_COMMA }}
          IPO_NAME_PREFIX: ${{ github.event.inputs.ipo_prefix }}
          DEBUG: 'false'
        run: |
          python fetch_ipo_status.py
